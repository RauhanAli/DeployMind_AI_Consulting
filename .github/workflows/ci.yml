name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-lint:
    name: API · lint & type check
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests || echo "::warning::ruff format differences (advisory)"
      - name: mypy (advisory - Optional-narrowing on ORM lookups is tracked in CONTRIBUTING.md)
        run: mypy app --ignore-missing-imports || echo "::warning::mypy reported findings (advisory, non-blocking)"

  api-tests:
    name: API · unit, integration, RBAC & tenant-isolation tests
    runs-on: ubuntu-latest
    needs: api-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: deploymind, POSTGRES_PASSWORD: deploymind, POSTGRES_DB: deploymind_test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U deploymind" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    defaults: { run: { working-directory: apps/api } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://deploymind:deploymind@localhost:55432/deploymind_test
      REDIS_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly and match the models
        env: { DATABASE_URL: postgresql+psycopg://deploymind:deploymind@localhost:55432/deploymind_test }
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: api-coverage, path: apps/api/coverage.xml }

  web:
    name: Web · lint, type check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deploymind/web lint
      - run: pnpm --filter @deploymind/web typecheck
      - run: pnpm --filter @deploymind/web test
      - run: pnpm --filter @deploymind/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r <(python -c "import tomllib;print('\n'.join(tomllib.load(open('apps/api/pyproject.toml','rb'))['project']['dependencies']))")
      - name: Static analysis (bandit rules via ruff S)
        run: pip install ruff && ruff check --select S apps/api/app
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Node dependency audit
        run: pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api-tests, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with: { context: apps, file: apps/api/Dockerfile, push: false, tags: "deploymind/api:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Worker image
        uses: docker/build-push-action@v6
        with: { context: apps, file: apps/worker/Dockerfile, push: false, tags: "deploymind/worker:${{ github.sha }}" }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: false, tags: "deploymind/web:${{ github.sha }}" }
      - name: Assistant service image + its unit tests
        run: |
          docker build -t deploymind/assistant:${{ github.sha }} apps/assistant-service
          docker run --rm deploymind/assistant:${{ github.sha }} python -m unittest -v

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api-tests, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: deploymind, POSTGRES_PASSWORD: deploymind, POSTGRES_DB: deploymind }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U deploymind" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    env:
      AUTH_RATE_LIMIT_PER_MINUTE: "500"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Install
        run: |
          python -m venv apps/api/.venv && apps/api/.venv/bin/pip install -e "apps/api[dev]"
          pnpm install --frozen-lockfile && pnpm --filter @deploymind/web build
          pnpm --filter @deploymind/web exec playwright install --with-deps chromium
      - name: Seed demo data and start the stack
        run: |
          cd apps/api && .venv/bin/python -m app.seed.demo --reset && cd ../..
          ./scripts/dev-start.sh
      - run: pnpm --filter @deploymind/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: "apps/web/playwright-report\nvar/log" }
