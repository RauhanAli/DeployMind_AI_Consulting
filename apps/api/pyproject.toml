[project]
name = "deploymind-api"
version = "0.1.0"
description = "DeployMind platform API: assess, build, deploy and run enterprise AI systems"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "cryptography>=43",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "openai>=1.50",
  "anthropic>=0.39",
  "langgraph>=0.2",
  "reportlab>=4.2",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.21",
  "docker>=7.1",
  "boto3>=1.35",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "S311", "S603", "S607", "B904", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = false
